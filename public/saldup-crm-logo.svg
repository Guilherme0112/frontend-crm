<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Gradiente contínuo do roxo/índigo ao ciano/turquesa -->
    <linearGradient id="neonGradient" x1="120" y1="300" x2="680" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6C4DF6" />
      <stop offset="30%" stop-color="#4A6CF7" />
      <stop offset="55%" stop-color="#1E9DF2" />
      <stop offset="80%" stop-color="#0AC5E8" />
      <stop offset="100%" stop-color="#0CE8C6" />
    </linearGradient>

    <!-- Recortes para criar o espaçamento limpo entre o boneco central e os laterais -->
    <clipPath id="leftPersonClip">
      <path d="M 0,0 H 800 V 600 H 0 Z M 400,295 A 104,104 0 0 0 296,399 V 426 H 504 V 399 A 104,104 0 0 0 400,295 Z" />
    </clipPath>
    <clipPath id="rightPersonClip">
      <path d="M 0,0 H 800 V 600 H 0 Z M 400,295 A 104,104 0 0 0 296,399 V 426 H 504 V 399 A 104,104 0 0 0 400,295 Z" />
    </clipPath>
  </defs>

  <g fill="url(#neonGradient)">
    <!-- Colchete Esquerdo (<) -->
    <path d="M 275,145 L 150,275 Q 125,300 150,325 L 275,455" fill="none" stroke="url(#neonGradient)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Colchete Direito (>) -->
    <path d="M 525,145 L 650,275 Q 675,300 650,325 L 525,455" fill="none" stroke="url(#neonGradient)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Pessoa Esquerda -->
    <g clip-path="url(#leftPersonClip)">
      <circle cx="305" cy="268" r="30" />
      <path d="M 248,376 A 57,57 0 0 1 362,376 L 362,385 Q 362,395 352,395 L 258,395 Q 248,395 248,385 Z" />
    </g>

    <!-- Pessoa Direita -->
    <g clip-path="url(#rightPersonClip)">
      <circle cx="495" cy="268" r="30" />
      <path d="M 438,376 A 57,57 0 0 1 552,376 L 552,385 Q 552,395 542,395 L 448,395 Q 438,395 438,385 Z" />
    </g>

    <!-- Pessoa Central (Destaque) -->
    <circle cx="400" cy="242" r="44" />
    <path d="M 310,399 A 90,90 0 0 1 490,399 L 490,412 Q 490,424 478,424 L 322,424 Q 310,424 310,412 Z" />
  </g>
</svg>