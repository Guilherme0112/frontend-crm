<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/saldup-crm-logo.svg" />
    <title>CRM SaldUp</title>
    <meta
      name="description"
      content="Plataforma CRM multi-tenant para gestão de pipelines Kanban, leads, templates de envio, equipe e faturamento."
    />
    <meta property="og:title" content="CRM SaldUp — Gestão Comercial e Pipelines" />
    <meta
      property="og:description"
      content="Plataforma CRM multi-tenant para gestão de pipelines Kanban, leads, templates de envio, equipe e faturamento."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('crm_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#fafaf9] text-zinc-900 antialiased dark:bg-[#101012] dark:text-zinc-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
